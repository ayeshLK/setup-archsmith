version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # @vercel/ncc 0.44.1 cannot build this action with TypeScript 7 yet.
      # Keep TypeScript on 5.9.x until the bundling toolchain adds support.
      - dependency-name: typescript
        versions:
          - ">=6.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Colombo
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      workflow-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
